[package]
name = "crab-gallery"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
base64 = "0.22"
form_urlencoded = "1.2"
futures-util = "0.3"
http-body-util = "0.1"
multer = "3.1"
chrono = { version = "0.4.45", features = ["serde"] }
libvips = "2.3.0"
mimetype-detector = "0.3.10"
notify = "8.0.0"
serde = { version = "1.0.228", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
tera = { version = "2.0.0", features = ["glob_fs"] }
tokio = { version = "1.52.3", features = ["full"] }
walkdir = "2.5.0"
